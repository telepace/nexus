# Railway configuration for Backend service
# This configuration defines the build and deployment settings for the FastAPI backend

[deploy]
# Database migration before starting the service
preDeployCommand = ["cd backend && uv sync && uv run alembic upgrade head"]

# Health check configuration
healthcheckPath = "/api/v1/utils/health-check/"
healthcheckTimeout = 10

# Restart policy for failures
restartPolicyType = "on_failure"

# Environment-specific configurations
[environments.production]
PORT = 8000
WORKERS = 4

[environments.staging]
PORT = 8000 
WORKERS = 2

# Watch patterns for automated deployments
watchPatterns = [
    "app/**",
    "scripts/**", 
    "pyproject.toml",
    "uv.lock",
    "alembic.ini"
]