# LiteLLM Configuration File - Optimized Version
general_settings:
  database_url: "os.environ/DATABASE_URL"
  drop_params: false
  set_verbose: true
  debug: true
  master_key: "os.environ/LITELLM_MASTER_KEY"
  disable_spend_logs: false
  store_model_in_db: true
  store_prompts_in_spend_logs: true
  environment_variables:
    OPENAI_API_KEY: "os.environ/OPENAI_API_KEY"
    OPENAI_BASE_URL: "os.environ/OPENAI_BASE_URL"
    OR_API_KEY: "os.environ/OR_API_KEY"
    GITHUB_API_KEY: "os.environ/GITHUB_API_KEY"
    VOLCENGINE_API_KEY: "os.environ/VOLCENGINE_API_KEY"
    VOLCENGINE_BASE_URL: "os.environ/VOLCENGINE_BASE_URL"
    GEMINI_API_KEY: "os.environ/GEMINI_API_KEY"

model_list:
  # ===== 主力对话模型 =====
  
  # Gemini 系列 - Google's flagship models
  - model_name: gemini-pro
    litellm_params:
      model: openrouter/google/gemini-2.5-pro
      api_key: "os.environ/OR_API_KEY"
      metadata:
        category: "flagship"
        provider: "google"
        use_case: "general_chat"

  - model_name: gemini-flash
    litellm_params:
      model: openrouter/google/gemini-2.5-flash
      api_key: "os.environ/OR_API_KEY"
      metadata:
        category: "fast"
        provider: "google"
        use_case: "quick_responses"

  - model_name: gemini-flash-lite
    litellm_params:
      model: openrouter/google/gemini-2.5-flash-lite-preview-06-17
      api_key: "os.environ/OR_API_KEY"
      metadata:
        category: "lightweight"
        provider: "google"
        use_case: "simple_tasks"

  - model_name: gemini-2-flash
    litellm_params:
      model: openrouter/google/gemini-2.0-flash
      api_key: "os.environ/OR_API_KEY"
      metadata:
        category: "previous_gen"
        provider: "google"
        use_case: "general_chat"

  # DeepSeek 系列 - Advanced reasoning models
  - model_name: deepseek-v3
    litellm_params:
      model: openrouter/deepseek/deepseek-chat-v3-0324
      api_key: "os.environ/OR_API_KEY"
      rpm: 100
      metadata:
        category: "flagship"
        provider: "deepseek"
        use_case: "advanced_reasoning"

  - model_name: deepseek-r1
    litellm_params:
      model: openrouter/deepseek/deepseek-r1-0528
      api_key: "os.environ/OR_API_KEY"
      metadata:
        category: "reasoning"
        provider: "deepseek"
        use_case: "complex_reasoning"

  # ===== 开源模型 =====

  # Meta Llama 系列
  - model_name: llama-70b
    litellm_params:
      model: openrouter/meta-llama/llama-3.3-70b-instruct
      api_key: "os.environ/OR_API_KEY"
      metadata:
        category: "opensource_large"
        provider: "meta"
        use_case: "general_chat"

  - model_name: llama-8b
    litellm_params:
      model: openrouter/meta-llama/llama-3.1-8b-instruct
      api_key: "os.environ/OR_API_KEY"
      metadata:
        category: "opensource_small"
        provider: "meta"
        use_case: "lightweight_tasks"

  - model_name: llama-vision
    litellm_params:
      model: github/Llama-3.2-11B-Vision-Instruct
      api_key: "os.environ/GITHUB_API_KEY"
      metadata:
        category: "vision"
        provider: "meta"
        use_case: "vision_understanding"

  # Qwen 系列
  - model_name: qwen-235b
    litellm_params:
      model: openrouter/qwen/qwen3-235b-a22b
      api_key: "os.environ/OR_API_KEY"
      metadata:
        category: "flagship"
        provider: "alibaba"
        use_case: "advanced_reasoning"

  - model_name: qwen-32b
    litellm_params:
      model: openrouter/qwen/qwen3-32b
      api_key: "os.environ/OR_API_KEY"
      metadata:
        category: "large"
        provider: "alibaba"
        use_case: "general_chat"

  - model_name: qwen-7b
    litellm_params:
      model: openrouter/qwen/qwen-2.5-7b-instruct
      api_key: "os.environ/OR_API_KEY"
      metadata:
